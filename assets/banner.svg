<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">code-sentinel</title>
  <desc id="desc">Evidence-gated code review for Claude Code</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151b3a"/>
      <stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="180" fill="#a78bfa" fill-opacity="0.10"/>
  <circle cx="1120" cy="300" r="140" fill="#38bdf8" fill-opacity="0.08"/>

  <g transform="translate(72 84)">
    <rect width="84" height="84" rx="20" fill="url(#accent)"/>
    <path d="M24 44l12 12 24-26" fill="none" stroke="#0b1020" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="184" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1">code-sentinel</text>
  <text x="186" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Evidence-gated code review for Claude Code</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#e2e8f0">
    <rect x="72" y="224" width="236" height="44" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="190" y="252" text-anchor="middle">Cited evidence</text>
    <rect x="324" y="224" width="252" height="44" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="450" y="252" text-anchor="middle">Deterministic context</text>
    <rect x="592" y="224" width="236" height="44" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="710" y="252" text-anchor="middle">Mechanical gate</text>
    <rect x="844" y="224" width="212" height="44" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="950" y="252" text-anchor="middle">Read-only</text>
  </g>
</svg>
